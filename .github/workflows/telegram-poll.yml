name: Telegram On-Demand Search

# Il bot Telegram manda messaggi ma non ne riceve: questo workflow è
# l'"ascolto" mancante. Ogni 15 minuti controlla se hai scritto /cerca al bot
# — un controllo leggero (una chiamata getUpdates), non una ricerca voli: non
# consuma quota SerpApi. Solo se trova il comando lancia una ricerca vera con
# lo stesso entry point del cron giornaliero (src/index.js) — nessuna logica
# duplicata.
#
# Perché non è "zero chiamate finché non scrivo /cerca": senza qualcosa che
# controlli periodicamente, non c'è modo di sapere che hai scritto qualcosa —
# GitHub Actions non può restare in ascolto 24/7 di suo. Un vero "zero
# finché non lo usi" richiederebbe un piccolo servizio esterno sempre attivo
# (es. Cloudflare Worker) come webhook Telegram, fuori da GitHub: è la
# strada scartata in origine per restare senza dipendenze esterne.
#
# Costo: ~96 run/giorno da pochi secondi l'uno. Su repo pubblico i minuti
# Actions sono illimitati; su repo privato rientrano nel piano gratuito solo
# se non già saturato dal resto — vedi todo.md.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      register_commands:
        description: 'Ripubblica il menu comandi "/" del bot su Telegram'
        type: boolean
        default: false

permissions:
  contents: write

# Stesso group di monitor.yml: i due workflow scrivono entrambi su file
# committati (data/telegram_offset.json, data/last_prices.json) e non devono
# mai girare in parallelo, altrimenti git-auto-commit-action rischia un
# conflitto di push.
concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  poll:
    name: Check for /cerca command
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Il menu "/" della chat è uno stato che vive su Telegram, non nel repo:
      # si ripubblica a mano quando cambia la lista in src/telegram-commands.js.
      # Sta qui, e non solo come script locale, perché il token è una secret di
      # GitHub: così non serve averlo sulla propria macchina.
      - name: Register Telegram command menu
        if: inputs.register_commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run telegram:commands

      # Un blip momentaneo (rete, rate limit di Telegram) si autocorregge da
      # solo al giro successivo tra 10 minuti: non deve marcare il job come
      # fallito, altrimenti ogni intoppo transitorio diventa un'icona rossa
      # nella cronologia delle Actions.
      - name: Poll Telegram for a command
        id: poll
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/telegram-poll.js

      - name: Commit updated Telegram offset
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update telegram offset [skip ci]'
          file_pattern: data/telegram_offset.json
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      # Da qui in poi: stessi passi di monitor.yml, ma solo se il comando è
      # stato riconosciuto. Nessuna logica di ricerca duplicata — è lo stesso
      # `npm start`, solo con FORCE_NOTIFY sempre attivo (un comando esplicito
      # merita sempre una risposta, anche "nessuna variazione").
      - name: Run monitor on demand
        id: monitor
        if: steps.poll.outputs.triggered == 'true'
        continue-on-error: true
        env:
          BUDGET_ASIA_AUTUNNO_2026: ${{ secrets.BUDGET_ASIA_AUTUNNO_2026 }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          AMADEUS_ENV: ${{ vars.AMADEUS_ENV || 'test' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FLIGHT_PROVIDER: serpapi
          FORCE_NOTIFY: 'true'
        run: npm start

      - name: Commit price snapshot
        if: steps.poll.outputs.triggered == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: on-demand search via Telegram [skip ci]'
          file_pattern: data/last_prices.json
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      - name: Fail the job if the monitor errored
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "::error::La ricerca su richiesta ha segnalato errori. Controlla i log dello step 'Run monitor on demand'."
          exit 1

      # Il bot ha già risposto "🔍 Ricerca avviata, risultati a breve...": se il
      # run muore dopo l'ack, senza questo passo resti ad aspettare un
      # risultato che non arriverà mai, e l'unico modo di accorgersene è aprire
      # la tab Actions. Un ack senza esito è peggio di nessun ack.
      #
      # Va in fondo per forza: `failure()` diventa vero solo *dopo* che uno
      # step è fallito, e lo step precedente è proprio quello che trasforma
      # l'errore del monitor (continue-on-error) in un fallimento del job.
      #
      # Il messaggio non riporta l'errore: i dettagli stanno nei log, e questo
      # canale non deve diventare un posto dove può finire per sbaglio il
      # contenuto di una variabile d'ambiente.
      - name: Tell Telegram the on-demand search failed
        if: failure() && steps.poll.outputs.triggered == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"chat_id":"%s","text":"❌ La ricerca non è andata a buon fine. Log del run: %s","disable_web_page_preview":true}' "${TELEGRAM_CHAT_ID}" "${RUN_URL}")" \
            > /dev/null

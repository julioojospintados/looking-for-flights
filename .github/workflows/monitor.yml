name: Flight Price Monitor

on:
  schedule:
    # Due volte a settimana, non due volte al giorno: con 15 ricerche a run e
    # un piano da 250 al mese, il cron giornaliero ne chiedeva 450 — più
    # dell'intera quota, prima ancora di contare i /cerca. Lunedì e giovedì
    # alle 07:00 UTC = ~130 ricerche/mese, lasciando il resto alle richieste
    # esplicite (che è il modo in cui questo progetto viene usato davvero).
    - cron: '0 7 * * 1,4'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Invia la notifica anche se nulla è cambiato'
        type: boolean
        default: false
      dry_run:
        description: 'Esegui senza notificare e senza salvare lo stato'
        type: boolean
        default: false
      provider:
        description: 'Provider voli da usare'
        type: choice
        default: serpapi
        options:
          - serpapi
          - amadeus
          - mock

# Necessario a git-auto-commit-action per pushare lo snapshot aggiornato.
permissions:
  contents: write

# Evita che un run schedulato e uno manuale si sovrascrivano lo stato a vicenda.
concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check flight prices
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Nessuna dipendenza esterna: il progetto usa solo la standard library di
      # Node 20+ (fetch globale). Lo step resta per sicurezza se in futuro
      # verranno aggiunte dipendenze.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run monitor
        id: monitor
        env:
          # Budget privato — una secret per viaggio, mai nel config committato.
          # Nome: BUDGET_<ID-VIAGGIO-MAIUSCOLO>. Aggiungi una riga per ogni
          # viaggio abilitato in config/trips.json.
          # Secret oppure variable: creare il valore nella tab sbagliata di
          # "Secrets and variables" è l'errore più comune, e produceva un run
          # fallito senza spiegazione. Il repo è privato, quindi una variable
          # non è meno riservata di una secret; su repo pubblico invece una
          # variable è leggibile da chiunque — lì usa la secret.
          BUDGET_ASIA_AUTUNNO_2026: ${{ secrets.BUDGET_ASIA_AUTUNNO_2026 || vars.BUDGET_ASIA_AUTUNNO_2026 }}

          # Provider voli — bastano le credenziali di quello effettivamente usato.
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          AMADEUS_ENV: ${{ vars.AMADEUS_ENV || 'test' }}

          # Notifiche — Telegram e/o Slack, entrambi opzionali.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          FLIGHT_PROVIDER: ${{ inputs.provider || 'serpapi' }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
          # Distingue chi sta aspettando una risposta da chi no: solo le
          # richieste esplicite possono intaccare la riserva di quota.
          # Il webhook Telegram fa dispatch con force_notify=true, il cron no.
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'ondemand' }}
          DRY_RUN: ${{ inputs.dry_run }}
        # `continue-on-error` così un errore API non impedisce di committare i
        # dati raccolti; l'esito reale resta visibile in `steps.monitor.outcome`.
        continue-on-error: true
        # `pipefail` è obbligatorio con la pipe: senza, l'exit code sarebbe
        # quello di `tee` (sempre 0) e un fallimento passerebbe per successo.
        run: |
          set -o pipefail
          npm start 2>&1 | tee "${RUNNER_TEMP}/monitor.log"

      - name: Commit price snapshot
        if: ${{ inputs.dry_run != true }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update flight price snapshot [skip ci]'
          file_pattern: data/last_prices.json
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      - name: Fail the job if the monitor errored
        if: ${{ steps.monitor.outcome == 'failure' }}
        run: |
          echo "::error::Il monitor ha segnalato errori (quota API, volo non trovato o notifica fallita). Controlla i log dello step 'Run monitor'."
          exit 1

      # Un run schedulato che fallisce è silenzioso per definizione: nessuno
      # guarda la tab Actions due volte al giorno. Senza questo avviso, un
      # secret scaduto o una quota finita si manifestano solo come notifiche
      # che smettono di arrivare — indistinguibili da "i prezzi non sono
      # cambiati". Deve stare dopo lo step qui sopra: `failure()` è vero solo
      # una volta che un passo è effettivamente fallito.
      - name: Tell Telegram the scheduled run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REASON=$(grep -a '❌' "${RUNNER_TEMP}/monitor.log" 2>/dev/null | tail -1 | cut -c1-300)
          [ -z "${REASON}" ] && REASON="❌ Il monitoraggio programmato è fallito."
          # printf per l'a capo: una newline scritta a mano dentro la stringa
          # chiuderebbe il blocco YAML `run: |`.
          TEXT=$(printf '%s\nLog del run: %s' "${REASON}" "${RUN_URL}")
          jq -n --arg chat "${TELEGRAM_CHAT_ID}" --arg text "${TEXT}" \
                '{chat_id: $chat, text: $text, disable_web_page_preview: true}' \
            | curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -H 'Content-Type: application/json' -d @- > /dev/null
